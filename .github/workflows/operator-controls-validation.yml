name: Operator controls validation
on:
  push:
    branches: [validation/operator-controls-060]
    paths: [.github/workflows/operator-controls-validation.yml]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Apply exact source and verify hashes
        run: python -B .maintenance/operator-controls/apply.py
      - name: Offline tests (no model calls)
        run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/check_release.py
      - run: python -B scripts/build_runtime_zip.py
  candidate:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Publish only the exact tested clean source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .maintenance/operator-controls/apply.py --publish-candidate
