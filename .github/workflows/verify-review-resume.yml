name: Verify generic stream recovery integration
on:
  push:
    branches: [prep/generic-reconnect-review-resume-20261018]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Syntax and CLI smoke tests (no model/network calls)
        run: |
          set -Eeuo pipefail
          python3 -B -m py_compile codex_transport.py arquilo.py review_resume.py tests/test_review_resume.py tests/test_reconnect_stop.py
          python3 -B arquilo.py tasklist resume-review --help
          python3 -B arquilo.py tasklist run --help >/dev/null
      - name: Run full offline regression suite
        run: python3 -B -m unittest discover -s tests -v
