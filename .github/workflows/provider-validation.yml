name: Provider configuration validation
on:
  push:
    branches: [validation/decide-provider-config]
    paths: [.github/workflows/provider-validation.yml]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -B .maintenance/provider/apply.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/check_release.py
      - run: python -B scripts/build_runtime_zip.py
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        codex: ['0.154.0', '0.159.1']
    env:
      PYTHONUTF8: '1'
      TEST_CODEX_VERSION: ${{ matrix.codex }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -B .maintenance/provider/apply.py
      - name: Install exact test-only Codex binary
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, pathlib, subprocess, sys
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'codex-compat-binary'
          subprocess.run([sys.executable, 'scripts/install_test_codex.py', os.environ['TEST_CODEX_VERSION'], str(target)], check=True)
      - name: Verify real CLI metadata and local fake gateway (no model service)
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          binary = pathlib.Path(os.environ['RUNNER_TEMP']) / 'codex-compat-binary' / ('codex.exe' if os.name == 'nt' else 'codex')
          expected = 'absent' if os.environ['TEST_CODEX_VERSION'] == '0.154.0' else 'present'
          subprocess.run([sys.executable, '-B', 'scripts/check_codex_features.py', '--codex', str(binary), '--expect-daemon', expected], check=True)
          subprocess.run([sys.executable, '-B', 'scripts/check_codex_provider.py', '--codex', str(binary)], check=True)
  candidate:
    needs: [offline, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Create clean feature branch only, never update main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .maintenance/provider/apply.py --publish-candidate
