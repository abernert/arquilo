name: Provider configuration validation
on:
  push:
    branches: [validation/decide-provider-config]
    paths: [.github/workflows/provider-validation.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Require all fifteen real validation jobs on the exact tested patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, subprocess
          run = json.loads(subprocess.check_output(['gh','api','repos/abernert/arquilo/actions/runs/36768273252'], text=True))
          assert run['head_sha'] == 'f20000db2e0f39b4bdaa68d23ef0bd71f6a0ed66'
          jobs = json.loads(subprocess.check_output(['gh','api','repos/abernert/arquilo/actions/runs/36768273252/jobs?per_page=100'], text=True))['jobs']
          required = [j for j in jobs if j['name'].startswith(('offline (','native ('))]
          assert len(required) == 15 and all(j['conclusion']=='success' for j in required)
          print('All nine offline and six real-CLI loopback tests succeeded; no provider billing.')
      - name: Create clean feature branch only, never update main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .maintenance/provider/apply.py --publish-candidate
