name: Project log layout validation
on:
  push:
    branches: [validation/project-log-layout]
    paths: [.github/workflows/project-log-validation.yml]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Apply exact tested source including serialized lock creation
        run: python -B .maintenance/project-layout/apply.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/check_release.py
      - run: python -B scripts/build_runtime_zip.py
  candidate:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Publish only the tested feature branch, never main or tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .maintenance/project-layout/apply.py --publish-candidate
