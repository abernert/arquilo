name: Codex metadata compatibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        codex: ['0.154.0', '0.159.1']
    env:
      PYTHONUTF8: '1'
      TEST_CODEX_VERSION: ${{ matrix.codex }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Download exact upstream CLI and verify its release digest
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, pathlib, subprocess, sys
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'codex-compat-binary'
          subprocess.run([sys.executable, 'scripts/install_test_codex.py', os.environ['TEST_CODEX_VERSION'], str(target)], check=True)
      - name: Verify minimal Exec contract and synthetic provider config; no model calls
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          binary = pathlib.Path(os.environ['RUNNER_TEMP']) / 'codex-compat-binary' / ('codex.exe' if os.name == 'nt' else 'codex')
          subprocess.run([sys.executable, '-B', 'scripts/check_codex_configuration.py', '--codex', str(binary)], check=True)
      - name: Verify model, provider and profile selection with a loopback fake gateway
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          binary = pathlib.Path(os.environ['RUNNER_TEMP']) / 'codex-compat-binary' / ('codex.exe' if os.name == 'nt' else 'codex')
          subprocess.run([sys.executable, '-B', 'scripts/check_codex_provider.py', '--codex', str(binary)], check=True)
