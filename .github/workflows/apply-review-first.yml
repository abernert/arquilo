name: Qualify exact native review patch
on:
  push:
    branches: ['hotfix/0.10.0-network-review-resume']
    paths: ['.github/workflows/apply-review-first.yml']
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'abernert/arquilo' && github.ref == 'refs/heads/hotfix/0.10.0-network-review-resume'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Fetch exact source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/abernert/arquilo.git
          git fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -c 'import sys; assert sys.version_info >= (3,11); print(sys.version)'
      - name: Apply and verify prepared patch bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, lzma, os, subprocess, json
          from pathlib import Path
          staged = ['.github/workflows/apply-review-first.yml'] + ['maintenance/review-first.patch.xz.'+p for p in ('01','02','03')]
          changed = set(subprocess.check_output(['git','diff','--name-only','5c4c15397359484aef51c188e880be4becb10c98','HEAD'],text=True).splitlines())
          assert changed == set(staged), changed
          packed = b''.join(Path(p).read_bytes() for p in staged[1:])
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == 'bc487b7d3f26519d484ea9f9e21b1048c08464148733e2d444d53c619cac1288'
          dest = Path(os.environ['RUNNER_TEMP'])/'native-review.patch'
          dest.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(dest)],check=True)
          subprocess.run(['git','apply','--index',str(dest)],check=True)
          expected = {
            '.github/workflows/recovery-hotfix.yml':'1fca733aa6d899d33297272a90858cf8890d6d85',
            'CHANGELOG.md':'81fcf300825de691adcbdf6781acc1c165941d4c',
            'autobuild.py':'ba996ae6fbaa8840a04cae33060fee3f5aca37db',
            'docs/guides/cli-reference.json':'5d506b32b9e6479c01451f8b9471fa3df945ef28',
            'docs/guides/operator-guide.en.md':'9b7b89603128ea319f6eb1890ebda9898ee75c20',
            'docs/review-resume-network-hotfix.md':'add3303c495f1abe467e84482298b195aa89cd81',
            'documents/lean_package.json':'e9217ca62aa776c562276e1d25e6c3fcc85bacca',
            'review_candidate.py':'df2612d02455548ddfbf052ee4209befc793c0d2',
            'review_entry.py':'67f88616ddcaa73086083ef413f63097f025d2f1',
            'review_resume.py':'63e9c1e4ba2e83766b854a818cdda72f7d85db57',
            'run_todos.py':'f71fab524bd3d59322349a7899f9638ee220b54b',
            'scripts/documentation_reference.py':'1406a4a896b84994e5bfa55fbe7095d331961908',
            'tests/test_review_entry.py':'7ad88a5a3e542c85273138eb64261c5b7baa40cf',
            'tests/test_review_resume_network.py':'3af51c8e5b337bfad15539c95fec5255e25967ed'}
          actual_paths = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual_paths == set(expected), actual_paths
          for path, expected_sha in expected.items():
              actual_sha = subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual_sha == expected_sha, (path,actual_sha)
              print('Verified',path,actual_sha)
          (Path(os.environ['RUNNER_TEMP'])/'native-review-files.json').write_text(json.dumps({'files':expected,'remove':staged}))
          PY
          git diff --cached --check
      - name: Full offline suite and distribution checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -v
          python3 -B scripts/documentation_reference.py --check
          python3 -B scripts/check_release.py
          python3 -B scripts/build_runtime_zip.py
      - name: Store verified candidate commit without moving any branch
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, subprocess
          from pathlib import Path
          root='https://api.github.com/repos/abernert/arquilo/'
          def api(path,data=None):
              headers={'Authorization':'Bearer '+os.environ['TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
              raw=None if data is None else json.dumps(data).encode()
              request=urllib.request.Request(root+path,data=raw,headers=headers)
              with urllib.request.urlopen(request,timeout=60) as response:
                  return json.load(response)
          parent=os.environ['GITHUB_SHA']
          assert api('git/ref/heads/hotfix/0.10.0-network-review-resume')['object']['sha']==parent, 'Branch changed; refusing publication'
          manifest=json.loads((Path(os.environ['RUNNER_TEMP'])/'native-review-files.json').read_text())
          entries=[]
          for path,expected in manifest['files'].items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==expected
              result=api('git/blobs',{'content':Path(path).read_text(encoding='utf-8'),'encoding':'utf-8'})
              assert result['sha']==expected
              entries.append({'path':path,'mode':'100644','type':'blob','sha':expected})
          entries += [{'path':p,'mode':'100644','type':'blob','sha':None} for p in manifest['remove']]
          base=api('git/commits/'+parent)['tree']['sha']
          tree=api('git/trees',{'base_tree':base,'tree':entries})['sha']
          commit=api('git/commits',{'message':'fix: enter native review from archived task contract without production replay','tree':tree,'parents':[parent]})
          print('PUBLISH_COMMIT='+commit['sha'])
          print('PUBLISH_TREE='+tree)
          print('No branch moved: explicit lease-checked promotion remains required.')
          PY
