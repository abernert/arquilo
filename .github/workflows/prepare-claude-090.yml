name: Prepare Claude backend 0.9.0
on:
  push:
    branches: [prepare/claude-backend-090-20261022]
permissions:
  contents: write
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact test-only fixture change to published feature head
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          head = '5f0a2109a7be15f90a7f69767a673212a6054273'
          final = '7b8d757b7cdbead4d6c54e54e0e9860b848d632a'
          def git(*args, cwd=None):
              return subprocess.check_output(['git', *args], cwd=cwd, text=True).strip()
          assert git('rev-parse', 'origin/feat/claude-code-backend') == head
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'integrated'
          subprocess.run(['git', 'worktree', 'add', '--detach', str(work), head], check=True)
          p = work / 'tests/test_controller_hardening.py'
          s = p.read_text()
          old = "        self.git('init', '-q')\n        self.git('config', 'user.name', 'Synthetic Test')"
          new = "        self.git('init', '-q')\n        # Keep detached Git maintenance out of these disposable test repos.\n        self.git('config', 'maintenance.auto', 'false')\n        self.git('config', 'user.name', 'Synthetic Test')"
          assert s.count(old) == 1
          s = s.replace(old, new)
          anchor = '    def test_commit_only_explicit_paths_preserves_other_changes_and_logs(self):'
          helper = '''    def bare_remote(self):
                  remote = self.base / 'remote.git'
                  self.git('init', '--bare', '-q', str(remote))
                  # receive-pack otherwise may spawn maintenance after push returns,
                  # racing TemporaryDirectory.cleanup() on the remote object directory.
                  for key in ('receive.autogc', 'maintenance.auto'):
                      self.git('-C', str(remote), 'config', key, 'false')
                  return remote

              def test_temporary_repositories_disable_automatic_maintenance(self):
                  self.assertEqual(self.git('config', '--bool', 'maintenance.auto').strip(), b'false')
                  remote = self.bare_remote()
                  for key in ('receive.autogc', 'maintenance.auto'):
                      self.assertEqual(self.git('-C', str(remote), 'config', '--bool', key).strip(), b'false')

          '''
          # Remove only the Python continuation indentation added to this literal.
          lines = helper.splitlines(keepends=True)
          helper = lines[0] + ''.join(line[10:] if line.startswith('          ') else line for line in lines[1:])
          assert s.count(anchor) == 1
          s = s.replace(anchor, helper + anchor)
          old = "        remote=self.base/'remote.git'\n        subprocess.run(['git','init','--bare','-q',str(remote)],check=True)"
          assert s.count(old) == 2
          s = s.replace(old, '        remote = self.bare_remote()')
          p.write_text(s)
          subprocess.run(['git', 'add', 'tests/test_controller_hardening.py'], cwd=work, check=True)
          assert git('diff', '--cached', '--name-only', cwd=work) == 'tests/test_controller_hardening.py'
          assert git('write-tree', cwd=work) == final
          subprocess.run(['git', 'diff', '--cached', '--check'], cwd=work, check=True)
          print('Verified test-only tree:', final)
          PY
      - name: Repeated Git fixtures followed by full offline regression
        shell: bash
        run: |
          cd "$RUNNER_TEMP/integrated"
          PYTHONPATH=tests python -B - <<'PY'
          import unittest
          from test_controller_hardening import GitTests
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromTestCase(GitTests) for _ in range(25))
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
          python -B -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/fixture-integration-tests.log"
      - name: Package contracts remain unchanged
        shell: bash
        run: |
          cd "$RUNNER_TEMP/integrated"
          python -B scripts/check_release.py
          python -B scripts/build_runtime_zip.py
          echo 'a8abdda4d125e05c0267cc0b7dc03d884470521ad9dbd5d678a2dae1ce0c1b02  dist/arquilo-0.9.0.zip' | sha256sum --check
      - name: Stage clean test-only commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/integrated"
          TREE=$(git write-tree)
          test "$TREE" = 7b8d757b7cdbead4d6c54e54e0e9860b848d632a
          export GIT_AUTHOR_NAME='ARQUILO integration'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          COMMIT=$(git commit-tree "$TREE" -p 5f0a2109a7be15f90a7f69767a673212a6054273 -m 'Make disposable Git push fixtures deterministic during cleanup' -m 'Disable automatic maintenance only in temporary test repositories and add a fixture regression. Avoid detached receive-pack maintenance racing TemporaryDirectory.cleanup. Runtime code and package bytes are unchanged. Verified 25 repetitions and the full offline suite on Python 3.12.')
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push https://github.com/abernert/arquilo.git "$COMMIT:refs/heads/prepare/claude-backend-090-result-20261022"
          printf '%s\n' "$COMMIT" > "$RUNNER_TEMP/fixture-integration-commit.txt"
          echo "Clean test-only commit: $COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: claude-090-fixture-evidence
          path: |
            ${{ runner.temp }}/fixture-integration-commit.txt
            ${{ runner.temp }}/fixture-integration-tests.log
          retention-days: 7
          if-no-files-found: warn
