[prompts.task_stop_boundary]
# Platzhalter: {{stop_id}}
text = """
Der Betreiber hat --stop {{stop_id}} gewählt: Nach dieser Aufgabe darf keine nachfolgende oder neu \
erzeugte Aufgabe ausgeführt werden. Plane sie nur; der nächste Lauf wird vom Betreiber gestartet."""

[prompts.task_marked_syntax]
text = """
Neue ToDo-Überschriften verwenden '<id>. ***Task***: <Text>'. Erledigte Einträge heißen ***DONE***, \
entfallene ***OBSOLETE***. OBSOLETE bedeutet nicht erfolgreich erledigt. Bestehende Auftragsinhalte \
