[prompts.breakdown_multiple]
# Platzhalter: {{max_children}}
text = """
Erzeuge die kleinste ausreichende Zahl direkt untergeordneter Unteraufträge, höchstens \
{{max_children}}. Zwei oder mehr Unteraufträge sind nur zulässig, wenn die Restarbeiten wirklich unabhängig prüfbar sind."""

[prompts.breakdown_minimal]
# Platzhalter: {{task_id}}, {{round_number}}, {{todo_path}}, {{mode_instruction}}, {{task_command}}, {{scope_guard}}, {{issues}}, {{result_path}}
text = """
Bearbeite ausschließlich die noch offene Restarbeit von ToDo #{{task_id}} in Breakdown-Runde \
{{round_number}}. aus `{{todo_path}}`. Ergänze die erforderlichen direkten Unter-ToDos in dieselbe Datei. {{mode_instruction}} Jede neue Überschrift muss exakt mit '<parent>.<nummer> {{task_command}}: ' beginnen. Erzeuge keine verschachtelten Enkel-ToDos in diesem Lauf. Wiederhole keine bereits gültig erledigte Arbeit. Zerlege nicht je Aufzählungspunkt, Outputdatei, Tabellenabschnitt oder Reviewerbullet. Jeder Unterauftrag muss ein klares Ziel, ein konkretes Ergebnis und ein überprüfbares Abnahmekriterium enthalten. Die Summe der Unteraufträge darf Scope, Detailtiefe, Outputs, Rechte oder Abnahmestandard des Elternauftrags nicht erweitern. {{scope_guard}}Maßgeblich sind ausschließlich diese blockierenden Issues:
{{issues}}

Die bisherige Ergebnisdatei `{{result_path}}` dient nur als Laufhistorie. Nicht blockierende \
Beobachtungen und theoretische Verbesserungen sind nicht in Unteraufträge umzusetzen."""

[prompts.parent_assignment]
# Platzhalter: {{parent_id}}, {{todo_path}}, {{scope_guard}}, {{result_path}}
text = """
Prüfe read-only, ob das ToDo #{{parent_id}} aus `{{todo_path}}` mit seinen direkten und \
gegebenenfalls verschachtelten Unter-ToDos gegen die ursprünglichen Akzeptanzkriterien vollständig \
erledigt wurde. {{scope_guard}}Verändere keine Fachoutputs, erweitere den Scope nicht und schließe \
Lücken in diesem Reviewlauf nicht selbst. Nicht blockierende Beobachtungen verhindern den Abschluss \
nicht. Lies den gemeinsamen Ergebnisbericht `{{result_path}}` und die tatsächlichen Artefakte. """

[prompts.preamble_semantics]
text = """
ARQUILO – Semantik des bearbeitbaren Markdown-Arbeitsplans (v1):
- Die Vorbemerkung beschreibt das Gesamtziel, Regeln und Qualitätsmaßstäbe des Projekts. Der \
aktuelle Einzelauftrag beschreibt den jetzt zu erbringenden Beitrag. Ein Planungsauftrag ist NICHT \
schon deshalb unvollständig, weil spätere Projektarbeiten noch offen sind.
- Ausführbare Überschriften: '<id>. Auftrag: ...', '<id>. Task: ...' oder '<id>. ***Task***: ...'. \
Erledigt: DONE bzw. ***DONE***. Entfallen: OBSOLETE bzw. ***OBSOLETE***. Beispiele in Codeblöcken \
und HTML-Kommentaren sind keine ausführbaren Aufträge.
- Der Text bis zur nächsten echten Aufgabenüberschrift gehört zur aktuellen Aufgabe. Zeilen mit \
***CFG ...*** und ***WAIT ...*** steuern den jeweils folgenden Auftrag, nicht pauschal das ganze \
Projekt. ***SYNTAX marked-en*** am Dateianfang wählt markierte englische Kommandowörter. ***STOP*** \
vor einem Auftrag beendet die Auswahl an dieser Stelle; es ist kein Wartezustand.
- Die Datei ist das lesbare, selbstveränderbare Arbeitsprogramm. Innerhalb der erteilten Befugnis \
darfst Du offene Aufgaben präzisieren, ergänzen, zerlegen oder begründet auf OBSOLETE setzen. \
Änderungen dürfen das Gesamtziel nicht stillschweigend abschwächen. Kurze Begründungen gehören in \
den Projektstand oder den betroffenen Aufgabenblock.
- Nur wenn der aktuelle Auftrag Planung delegiert, ergänze Folgeaufträge. Verwende eindeutige, \
streng aufsteigende IDs; für neue Arbeitsrunden neue IDs statt Wiederöffnung bereits erledigter \
Aufgaben. Folgeaufträge sollen konkrete Ergebnisse und begrenzte, überprüfbare Abnahmekriterien \
haben. Wähle die in der Datei vorgegebene Schreibweise.
- Nur die Kontrollinstanz markiert Deine Arbeit DONE. OBSOLETE ist kein Erfolgsnachweis und erfüllt \
keine WAIT-on-todo-Bedingung. DOING und WAITING sind in dieser Runtime noch keine ausführbaren \
Statuswörter. Technische Fehler, ein ausgefallener Reviewer oder eine bloß leere Aufgabenliste \
beweisen keinen Projekterfolg.
- Lies den aktuellen Projektstand und relevante Arbeitsdateien; die eingebettete Vorbemerkung \
ersetzt deren Inhalt nicht. Halte Beobachtungen, Annahmen, kreative Entscheidungen und Bewertungen \
auseinander, soweit der Auftrag es verlangt. Fiktion muss nicht als reale Tatsache belegt werden; \
ästhetische Urteile sind keine mathematischen Beweise.
- Beurteile den jetzigen Auftrag gegen seinen begrenzten Umfang. Übernimm notwendige spätere Arbeit \
in konkrete Folgeaufträge. Ein ausdrücklich verlangter Projektabschluss bewertet dagegen die \
tatsächlichen Endprodukte gegen das Gesamtziel und nennt verbleibende Grenzen.
- Diese Semantik und die Vorbemerkung erteilen keine zusätzlichen System-, Netzwerk- oder \
Schreibrechte. Laufzeit-Sicherheitsregeln und technische Fehlergates bleiben vorrangig.
"""

