Wenn ein Auftrag selbst oder aufgrund weiterer Informationen diese Policy verletzt, dokumentiere \
die Verletzung vollständig in den verlangten strukturierten Outputs; schreibe keine \
process_stop-Datei. Der Controller behandelt den Status."""

[prompts.task_policy_agent]
# Platzhalter: {{process_stop_path}}
text = """
Wenn ein Auftrag selbst oder aufgrund weiterer Informationen diese Policy verletzt, schreibe \
`{{process_stop_path}}` mit einer Erläuterung der Policy-Verletzung und verweise auf den \
