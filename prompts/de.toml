[prompts.confidence_fields]
text = """
  \"confidence\": 0.0 bis 1.0 | null,
  \"confidence_reason\": \"beleggestützte Erklärung der Sicherheit und ihrer Grenzen\" | null,
  \"confidence_breakdown\": {
    \"requirements_coverage\": 0.0 bis 1.0 | null,
    \"implementation_correctness\": 0.0 bis 1.0 | null,
    \"test_evidence\": 0.0 bis 1.0 | null,
    \"regression_safety\": 0.0 bis 1.0 | null
  },
  \"evidence\": [\"konkret untersuchtes Artefakt oder Fundstelle oder beobachtete Prüfung mit Ergebnis\"],
  \"uncertainties\": [\"was nicht überprüft werden konnte und weshalb\"],
  \"suggested_checks\": [\"kleinste sinnvolle Folgeprüfung; ausschließlich ein Vorschlag\"]
"""

[prompts.confidence_rules]
# Platzhalter: {{max_text}}, {{max_items}}
text = """
- confidence ist deine unkalibrierte Sicherheit, dass das Urteil richtig ist, KEINE gemessene \
Wahrscheinlichkeit. Bei PASS bezeichnet sie die Sicherheit, dass der Auftrag erfüllt ist; auch ein \
gut belegtes FAIL kann eine hohe Sicherheit haben.
- Begründe jeden numerischen confidence-Wert durch eine nicht leere confidence_reason und \
mindestens einen konkreten evidence-Eintrag. Verwende confidence=null, wenn du keine beleggestützte \
Einschätzung geben kannst; erfinde niemals einen Wert, Test, Ausführungsbefund oder Verweis.
- Erkläre sowohl die Grundlage des Urteils als auch die verbleibenden Grenzen. Erfasse ungeprüfte \
Bereiche in uncertainties und schlage gegebenenfalls die kleinsten hilfreichen suggested_checks \
vor. Vorgeschlagene Prüfungen sind keine neuen Anforderungen oder Ausführungsbefugnisse.
- confidence_breakdown enthält getrennte subjektive Einschätzungen: requirements_coverage \
(Abdeckung ausdrücklicher Kriterien), implementation_correctness (Beleglage für deren korrekte \
Umsetzung), test_evidence (Aussagekraft relevanter beobachteter Prüfungen), regression_safety \
(Beleglage für die Erhaltung bisherigen Verhaltens). Höhere Werte bedeuten stärkere Belege, niemals \
höheres Risiko. Diese Dimensionen werden NICHT zu confidence gemittelt; ein sicheres FAIL kann eine \
niedrige implementation_correctness haben.
- Verwende null für unbekannte oder nicht anwendbare Dimensionen, insbesondere Tests und \
Regressionen bei Nicht-Software-Aufgaben. Verlange von Schreib- oder Analyseaufträgen keine \
Softwaretests, kein Belegregister und keine anderen neuen Ergebnisse. Die Untersuchung der \
tatsächlich verlangten Artefakte ist ein gültiger Beleg. Unterscheide beobachtete Prüfungen von \
Behauptungen des Erstellers.
- Die Sicherheitseinschätzung ist nur beratend. Verberge niemals ein konkret nicht erfülltes \
Abnahmekriterium in uncertainties, sondern melde einen blockierenden Mangel. Verwirf niemals einen \
Mangel, ändere nicht PASS/FAIL, verlange keine Zerlegung und wiederhole keine Arbeit allein für \
einen höheren Wert.
- Begrenze confidence_reason und jeden Eintrag einer Sicherheitsliste auf {{max_text}} Zeichen; \
evidence, uncertainties und suggested_checks dürfen jeweils höchstens {{max_items}} Einträge \
enthalten. Gib confidence_level nicht zurück; diese Anzeigebezeichnung leitet der Controller ab.
"""

[prompts.task_controller_only]
# Platzhalter: {{question_path}}, {{process_stop_path}}
text = """
Wenn Du Entscheidungen vom Nutzer brauchst oder Fragen hast, dokumentiere sie in \
`{{question_path}}` inklusive Datum/Zeit. Schreibe in diesem Auftrag niemals selbst eine \
`process_stop`-Datei. Erzeuge auch bei einem qualifizierten oder fehleranzeigenden Status alle \
verlangten strukturierten Outputs und schließe den Auftrag regulär ab. Ausschließlich der \
aufrufende Controller entscheidet nach Validierung über Korrektur, qualifizierte Fortsetzung oder \
einen technischen `{{process_stop_path}}`."""

[prompts.task_contract]
text = """
Wenn der Auftrag eine Prüf- und Reparaturbefugnis enthält, dokumentiere festgestellte Fehler \
getrennt und korrigiere sie im selben Auftrag innerhalb des freigegebenen Reparaturscopes. Fehler \
oder Widersprüche in bereitgestellten Eingaben sowie mehrere nach dem Auftrag vertretbare \
Interpretationen sind Analyseergebnisse, keine automatisch zu erzwingenden Nutzerentscheidungen. \
Ein separates Reparatur-ToDo ist nur für neue Recherche, Spezialzuständigkeit oder nicht lokal \
begrenzbare Großreparaturen vorgesehen."""

[prompts.parent_terminal]
text = """
Eine im ursprünglichen Auftrag ausdrücklich zulässige offene Frage, qualifizierte Aussage oder \
Halt-Markierung ist kein Mangel."""

[prompts.preflight]
text = """
Nur Vorabprüfung. Verändere keine Dateien. Antworte exakt: ok"""

[prompts.task_agent_stop]
# Platzhalter: {{question_path}}, {{process_stop_path}}
text = """
Wenn Du Entscheidungen vom Nutzer brauchst oder Fragen hast, dokumentiere sie in \
`{{question_path}}` inklusive Datum/Zeit. Antworten werden dort ebenfalls eingetragen. Falls Du \
ohne bestimmte Antworten nicht weitermachen kannst, notiere bei den entsprechenden Fragen, dass \
Antworten benötigt werden, und schreibe anschließend `{{process_stop_path}}` in den Workspace. \
Diese Datei muss erklären, welche Fragen eine Fortsetzung blockieren."""

[prompts.task_policy_intro]
# Platzhalter: {{policy_path}}, {{policy_text}}
text = """
Folgende Policy aus `{{policy_path}}` gilt verbindlich:
{{policy_text}}

"""

[prompts.task_mutable_plan]
text = """
Der Betreiber erlaubt Änderungen an derselben ToDo-Datei: ergänze oder überarbeite Aufgaben, soweit \
der Auftrag dies verlangt. Neue Aufgaben müssen eindeutige IDs haben und offen (TASK/Auftrag) sein. \
Lass den aktuell bearbeiteten Auftrag offen; seine Abnahme erfolgt separat gegen die ursprünglichen \
Anforderungen. Führe neu erzeugte Aufgaben nicht selbst aus, sofern du nur den Plan erstellen sollst. """

[prompts.task_guarded_plan]
text = """
Ändere den Status eines ToDos nie von \"Auftrag\" auf \"DONE\". Das ist ausschließlich einer \
separaten Kontrollinstanz vorbehalten. Ebenfalls ändere nie einen Status von \"DONE\" zurück auf \
