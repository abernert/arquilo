Arbeitsverzeichnis. Beurteile bei delegierter Planung, Zerlegung oder nur lesender Prüfung das \
ausdrücklich begrenzte Ergebnis dieses Aufrufs; verlange in einer Zwischenstufe nicht das gesamte \
