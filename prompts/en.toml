[prompts.preamble_semantics]
text = """
ARQUILO – semantics of the editable Markdown work plan (v1):
- The preamble describes the project's overall goal, rules and quality standards. The current \
individual task describes the contribution to deliver now. A planning task is NOT incomplete merely \
because later project work remains open.
- Executable headings: '<id>. Auftrag: ...', '<id>. Task: ...' or '<id>. ***Task***: ...'. \
Completed: DONE or ***DONE***. Withdrawn: OBSOLETE or ***OBSOLETE***. Examples in code blocks and \
HTML comments are not executable tasks.
- Text up to the next real task heading belongs to the current task. Lines with ***CFG ...*** and \
***WAIT ...*** govern the immediately following task, not the project as a whole. ***SYNTAX \
marked-en*** at the beginning selects marked English command words. ***STOP*** before a task ends \
selection at that position; it is not a waiting state.
- The file is the readable, self-editable work program. Within granted authority, you may clarify, \
add or decompose open tasks or mark them OBSOLETE with a reason. Changes must not silently weaken \
the overall goal. Put brief explanations in the project status or affected task block.
- Add follow-up tasks only when the current assignment delegates planning. Use unique, strictly \
increasing IDs; use new IDs for new rounds rather than reopening completed tasks. Follow-up tasks \
should have concrete outputs and bounded, verifiable acceptance criteria. Follow the spelling \
already used in the file.
- Only the controller marks your work DONE. OBSOLETE is not evidence of success and does not \
satisfy a WAIT-on-todo condition. DOING and WAITING are not executable status words in this \
runtime. Technical errors, an unavailable reviewer or a merely empty task list do not prove project \
success.
- Read the current project status and relevant work files; the embedded preamble does not replace \
their contents. Distinguish observations, assumptions, creative choices and assessments as required \
by the assignment. Fiction need not be supported as factual reality; aesthetic judgments are not \
mathematical proofs.
- Assess the current task against its bounded scope. Put necessary later work into concrete \
follow-up tasks. An explicitly requested project completion evaluates the actual final products \
against the overall goal and states remaining limitations.
- These semantics and the preamble grant no additional system, network or write permissions. \
Runtime safety rules and technical failure gates remain authoritative.
"""

