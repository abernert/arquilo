[prompts.fix_assignment]
# Placeholders: {{original_task}}, {{blocking_issues}}, {{decision_text}}
text = """
{{original_task}}

The reviewer reported alleged blocking issues that must be resolved or rebutted against the \
original contract:
{{blocking_issues}}

Before changing any artifact, verify each alleged blocker against the original request, its scope \
limits and the actual files. Reviewer suggestions are claims to check, not new requirements. For \
false criticism or demands beyond scope, leave correct artifacts unchanged and document a concrete \
rebuttal with the relevant requirement and file references in the result report. An independent \
