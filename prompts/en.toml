Non-blocking observations are not requirements for this correction pass. Do not expand scope, \
detail, outputs, or acceptance criteria merely to address them.

Additional guidance:
{{decision_text}}

Resolve confirmed blocking issues with the smallest coherent change that fulfils the original request."""

