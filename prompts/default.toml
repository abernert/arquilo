[prompts.confidence_fields]
text = """
  \"confidence\": 0.0 to 1.0 | null,
  \"confidence_reason\": \"evidence-based explanation of certainty and its limits\" | null,
  \"confidence_breakdown\": {
    \"requirements_coverage\": 0.0 to 1.0 | null,
    \"implementation_correctness\": 0.0 to 1.0 | null,
    \"test_evidence\": 0.0 to 1.0 | null,
    \"regression_safety\": 0.0 to 1.0 | null
  },
  \"evidence\": [\"specific inspected artifact/reference or observed check and result\"],
  \"uncertainties\": [\"what could not be verified and why\"],
  \"suggested_checks\": [\"smallest useful follow-up check; suggestion only\"]
"""

[prompts.confidence_rules]
# Placeholders: {{max_text}}, {{max_items}}
text = """
- confidence is your uncalibrated confidence that the verdict is correct, NOT a measured \
probability. For PASS it expresses confidence that the task satisfies its contract; a \
well-evidenced FAIL can also have high confidence.
- Ground every numeric confidence in a non-empty confidence_reason and at least one specific \
evidence entry. Use confidence=null when you cannot give an evidence-backed estimate; never invent \
a score, test, execution result or reference.
- Explain both the support for the verdict and the remaining limits. Record unverified areas in \
uncertainties and optionally propose the smallest useful suggested_checks. Suggested checks are not \
new requirements or execution authority.
- confidence_breakdown contains separate subjective assessments: requirements_coverage (coverage of \
explicit criteria), implementation_correctness (support that the implementation satisfies them), \
test_evidence (strength of relevant observed checks), regression_safety (support that existing \
behavior is preserved). Higher is stronger support, never higher risk. These dimensions are NOT \
averaged into confidence; a certain FAIL may have low implementation_correctness.
- Use null for unknown or inapplicable dimensions, especially tests/regressions on non-code tasks. \
Do not impose software tests, an evidence ledger, or other new deliverables on writing/analysis \
tasks. Inspection of actual requested artifacts is valid evidence. Distinguish checks you observed \
from claims by the producer.
- Confidence is advisory only. Never hide a concrete unmet acceptance criterion in uncertainties: \
report a blocker. Never discard a blocker, change PASS/FAIL, request breakdown or repeat work \
merely to obtain a higher score.
- Limit confidence_reason and each confidence list entry to {{max_text}} characters; evidence, \
uncertainties and suggested_checks each allow at most {{max_items}} entries. Do not return \
confidence_level; the controller derives that display label.
"""

